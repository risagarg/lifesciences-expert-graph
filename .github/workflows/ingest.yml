# Pulls experts for every indication in ingest/indications.yml from public data
# (ClinicalTrials.gov, PubMed, Medicare Part D, NPI Registry, Open Payments),
# adds the top candidates to people/, rebuilds the pages and commits the result.
# Runs every Monday, whenever the indications or ingest scripts change, and on demand
# (Actions tab > ingest > Run workflow).
name: ingest
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  push:
    branches: [main]
    paths: ["ingest/indications.yml", "scripts/ingest/**", ".github/workflows/ingest.yml"]
permissions:
  contents: write
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: ClinicalTrials.gov
        run: python3 scripts/ingest/clinicaltrials.py
        continue-on-error: true
      - name: PubMed
        run: python3 scripts/ingest/pubmed.py
        env: { NCBI_API_KEY: "${{ secrets.NCBI_API_KEY }}" }
        continue-on-error: true
      - name: Medicare Part D
        run: python3 scripts/ingest/partd.py
        continue-on-error: true
      - name: Add top candidates to people/
        run: python3 scripts/ingest/promote.py --top 20
      - name: NPI Registry lookups
        run: python3 scripts/ingest/nppes.py
        continue-on-error: true
      - name: Open Payments
        run: python3 scripts/ingest/openpayments.py
        continue-on-error: true
      - name: Rebuild pages
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with: { name: ingest-data, path: data/, retention-days: 30 }
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/nppes data/partd data/openpayments people tree EXPERTS.md
          git diff --cached --quiet && exit 0
          git commit -m "Ingest: refresh experts from public data"
          git pull --rebase origin main
          git push
