<title>Life Sciences Expert Graph</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header bar, node-link tree canvas on the left, detail sheet on the right; stacks on phones. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #18202b; --muted: #5b6676; --line: #d5dae2; --soft: #eceff4;
  --accent: #1f5fbf;
  --t-root: #18202b; --t-category: #6b7686; --t-stakeholder: #b45f06; --t-disease: #b4235a;
  --t-mechanism: #0f7d74; --t-asset: #4c4fc9; --t-data-source: #3f7d20; --t-organization: #8a4fb0; --t-evidence: #9a6b00; --t-person: #c0392b; --t-expert-group: #c0392b;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151b; --panel: #171c24; --ink: #e5e9ef; --muted: #98a2b1; --line: #2c3440; --soft: #1f2630;
  --accent: #78a9f5;
  --t-root: #e5e9ef; --t-category: #9aa4b2; --t-stakeholder: #f0a35a; --t-disease: #f07aa3;
  --t-mechanism: #4cc4b8; --t-asset: #9b9ef5; --t-data-source: #8ccf6a; --t-organization: #c79ae6; --t-evidence: #e0b44c; --t-person: #f08a7e; --t-expert-group: #f08a7e; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11151b; --panel: #171c24; --ink: #e5e9ef; --muted: #98a2b1; --line: #2c3440; --soft: #1f2630;
  --accent: #78a9f5;
  --t-root: #e5e9ef; --t-category: #9aa4b2; --t-stakeholder: #f0a35a; --t-disease: #f07aa3;
  --t-mechanism: #4cc4b8; --t-asset: #9b9ef5; --t-data-source: #8ccf6a; --t-organization: #c79ae6; --t-evidence: #e0b44c; --t-person: #f08a7e; --t-expert-group: #f08a7e; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; }
.app { height: 100%; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--muted); font-weight: 400; }
.search { position: relative; flex: 1 1 220px; max-width: 360px; }
.search input { width: 100%; box-sizing: border-box; font: inherit; padding: 7px 10px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); color: var(--ink); }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.results { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px; list-style: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.12); }
.results button { width: 100%; text-align: left; display: flex; gap: 8px; align-items: center; }
.btns { display: flex; gap: 6px; }
button { font: inherit; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
button:hover { background: var(--soft); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btns button { border-color: var(--line); color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); }
.canvas { overflow: auto; min-width: 0; }
svg { display: block; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
.xlink { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 4 4; opacity: 0.8; }
.node { cursor: pointer; }
.node circle { stroke-width: 2; }
.node text { font-family: var(--sans); font-size: 13px; fill: var(--ink); }
.node .count { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
.node:hover text.label { text-decoration: underline; }
.node:focus { outline: none; }
.node:focus-visible .halo, .node.sel .halo { stroke: var(--accent); stroke-width: 2; fill: none; }
.node.linked .halo { stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 3 3; fill: none; }
.node .halo { fill: none; stroke: none; }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; min-width: 0;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) 32px 20px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 2px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.crumbs button { padding: 2px 4px; color: var(--muted); }
aside h2 { font-size: 22px; line-height: 1.25; margin: 0 0 8px; letter-spacing: -0.01em; text-wrap: balance; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.pill.stub { border-style: dashed; }
.summary { font-size: 15px; line-height: 1.55; max-width: 62ch; margin: 14px 0; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 16px 0; font-size: 13px; }
dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
.body { line-height: 1.55; max-width: 62ch; }
.body h3 { margin-top: 18px; }
.body ul { padding-left: 18px; margin: 6px 0; }
.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.list button { width: 100%; text-align: left; display: flex; align-items: center; gap: 8px; padding: 6px 8px; }
.rel { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: auto; padding-left: 8px; white-space: nowrap; }
a { color: var(--accent); }
.path { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; margin-top: 24px; }
code { font-family: var(--mono); font-size: 12px; background: var(--soft); padding: 1px 4px; border-radius: 4px; }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 55%) auto; overflow: auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: no-preference) { .node circle { transition: r 0.15s; } }
</style>

<div class="app">
  <header>
    <h1>Life Sciences <span>Expert Graph</span></h1>
    <div class="search">
      <input id="q" type="search" placeholder="Find a drug, disease, company or expert…" autocomplete="off" aria-label="Find a node">
      <ul class="results" id="results" hidden></ul>
    </div>
    <div class="btns">
      <button id="expand" type="button">Expand all</button>
      <button id="collapse" type="button">Collapse</button>
    </div>
    <div class="legend" id="legend"></div>
  </header>
  <main>
    <div class="canvas" id="canvas" role="tree" aria-label="Expertise tree"></div>
    <aside id="detail" aria-live="polite"></aside>
  </main>
</div>

<script>
const DATA = /*__TREE_DATA__*/null;
const TYPES = { root: "Root", category: "Category", stakeholder: "Stakeholder", disease: "Disease", mechanism: "Mechanism", asset: "Drug", "data-source": "Data source", organization: "Organization", evidence: "Evidence", person: "Expert", "expert-group": "Experts" };
const byId = new Map(DATA.nodes.map(n => [n.id, n]));
const ROW = 30, COL = 215, PAD = 28;
const depth = id => id ? id.split("/").length : 0;
let selected = "", expanded = new Set(DATA.nodes.filter(n => n.children.length && n.type !== "expert-group" && depth(n.id) <= 2).map(n => n.id));

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const color = t => `var(--t-${TYPES[t] ? t : "category"})`;
const toHash = id => id ? id.replace(/\//g, "--") : "";
const fromHash = h => h.replace(/^#/, "").replace(/--/g, "/");
const ancestors = id => { const out = []; let n = byId.get(id); while (n && n.parent !== null) { out.unshift(n.parent); n = byId.get(n.parent); } return out; };
const isPeople = c => ["person", "expert-group"].includes(byId.get(c).type);
const countDesc = id => byId.get(id).children.filter(c => !isPeople(c)).reduce((s, c) => s + 1 + countDesc(c), 0);
const peopleIn = (id, acc = new Set()) => { for (const c of byId.get(id).children) { const n = byId.get(c); if (n.type === "person") acc.add(c.split("::").pop()); else peopleIn(c, acc); } return acc; };
const countPeople = id => peopleIn(id).size;

function linkedIds(id) {
  const n = byId.get(id);
  return new Set([...n.links.map(l => l.to), ...n.backlinks.map(b => b.from)]);
}

function layout() {
  const pts = new Map(); let row = 0, maxDepth = 0;
  (function walk(id, depth) {
    const n = byId.get(id); maxDepth = Math.max(maxDepth, depth);
    const kids = expanded.has(id) ? n.children : [];
    if (!kids.length) { pts.set(id, { x: PAD + depth * COL, y: PAD + row++ * ROW }); return; }
    kids.forEach(k => walk(k, depth + 1));
    const ys = kids.map(k => pts.get(k).y);
    pts.set(id, { x: PAD + depth * COL, y: (ys[0] + ys[ys.length - 1]) / 2 });
  })("", 0);
  return { pts, w: PAD * 2 + maxDepth * COL + 230, h: PAD * 2 + Math.max(row - 1, 0) * ROW };
}

function renderTree() {
  const { pts, w, h } = layout();
  const linked = linkedIds(selected);
  let edges = "", xl = "", nodes = "";
  for (const [id, p] of pts) {
    const n = byId.get(id);
    if (n.parent !== null && pts.has(n.parent)) {
      const q = pts.get(n.parent), mx = (q.x + p.x) / 2;
      edges += `<path class="edge" d="M${q.x},${q.y} C${mx},${q.y} ${mx},${p.y} ${p.x},${p.y}"/>`;
    }
  }
  const s = pts.get(selected);
  const labelEnd = (id, p) => p.x + 16 + byId.get(id).title.length * 7;
  if (s) for (const t of linked) { const p = pts.get(t); if (!p) continue;
    let [a, ai, b] = p.x <= s.x ? [p, t, s] : [s, selected, p];
    const x1 = labelEnd(ai, a), x2 = b.x - 10, mx = (x1 + x2) / 2;
    xl += `<path class="xlink" d="M${x1},${a.y} C${mx},${a.y} ${mx},${b.y} ${x2},${b.y}"/>`; }
  for (const [id, p] of pts) {
    const n = byId.get(id), has = n.children.length > 0, open = expanded.has(id);
    const cls = ["node", id === selected ? "sel" : "", linked.has(id) ? "linked" : ""].join(" ");
    const c = color(n.type);
    const np = has && !open ? countPeople(id) : 0;
    const hidden = has && !open ? `<tspan class="count" dx="8">${n.type === "expert-group" ? "" : [countDesc(id) ? `+${countDesc(id)}` : "", np ? `${np} expert${np === 1 ? "" : "s"}` : ""].filter(Boolean).join(" · ")}</tspan>` : "";
    nodes += `<g class="${cls}" data-id="${esc(id)}" tabindex="0" role="treeitem" aria-selected="${id === selected}"${has ? ` aria-expanded="${open}"` : ""}>
      <circle class="halo" cx="${p.x}" cy="${p.y}" r="11"/>
      ${n.type === "person" ? `<rect x="${p.x - 4}" y="${p.y - 4}" width="8" height="8" rx="2" fill="${c}"/>` : `<circle cx="${p.x}" cy="${p.y}" r="${has ? 6 : 4.5}" stroke="${c}" fill="${has && !open ? c : "var(--panel)"}"/>`}
      <text class="label" x="${p.x + 12}" y="${p.y + 4.5}">${esc(n.title)}${hidden}</text></g>`;
  }
  $("#canvas").innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${edges}${xl}${nodes}</svg>`;
}

function md(text) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out = "", list = false;
  for (const line of text.split("\n")) {
    const li = line.match(/^\s*[-*] (.*)/), hd = line.match(/^#{1,4} (.*)/);
    if (!li && list) { out += "</ul>"; list = false; }
    if (li) { if (!list) { out += "<ul>"; list = true; } out += `<li>${inline(li[1])}</li>`; }
    else if (hd) out += `<h3>${inline(hd[1])}</h3>`;
    else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  return out + (list ? "</ul>" : "");
}

function nodeButton(id, rel) {
  const n = byId.get(id);
  return `<li><button type="button" data-go="${esc(id)}"><span class="dot" style="background:${color(n.type)}"></span>${esc(n.title)}${rel ? `<span class="rel">${esc(rel)}</span>` : ""}</button></li>`;
}

function renderDetail() {
  const n = byId.get(selected);
  const crumbs = ancestors(selected).map(a => `<button type="button" data-go="${esc(a)}">${esc(byId.get(a).title)}</button><span>/</span>`).join("");
  const fields = Object.entries(n.fields).map(([k, v]) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(v)}</dd>`).join("");
  const conns = [...n.links.map(l => nodeButton(l.to, l.rel)), ...n.backlinks.map(b => nodeButton(b.from, "← " + b.rel))].join("");
  const srcs = n.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a></li>`).join("");
  $("#detail").innerHTML = `
    <nav class="crumbs" aria-label="Path">${crumbs}</nav>
    <h2>${esc(n.title)}</h2>
    <span class="pill${n.status === "stub" ? " stub" : ""}"><span class="dot" style="background:${color(n.type)}"></span>${esc(TYPES[n.type] || n.type)}${n.status ? " · " + esc(n.status) : ""}</span>
    ${n.summary ? `<p class="summary">${esc(n.summary)}</p>` : ""}
    ${fields ? `<dl>${fields}</dl>` : ""}
    ${n.body ? `<div class="body">${md(n.body)}</div>` : ""}
    ${(() => {
      const kids = n.children.filter(c => byId.get(c).type !== "expert-group");
      const grp = n.children.map(c => byId.get(c)).find(c => c.type === "expert-group");
      const experts = n.type === "expert-group" ? n.children : grp ? grp.children : [];
      const label = n.type === "evidence" ? "Named in this source" : "Experts";
      return (kids.length && n.type !== "expert-group" ? `<h3>Contents · ${kids.length}</h3><ul class="list">${kids.map(c => nodeButton(c)).join("")}</ul>` : "")
        + (experts.length ? `<h3>${label} · ${experts.length}</h3><ul class="list">${experts.map(c => nodeButton(c, byId.get(c).summary)).join("")}</ul>` : "");
    })()}
    ${conns ? `<h3>Connections</h3><ul class="list">${conns}</ul>` : ""}
    ${srcs ? `<h3>Sources</h3><ul class="list body">${srcs}</ul>` : ""}
    ${n.path ? `<div class="path">${esc(n.path)}</div>` : ""}`;
}

function select(id, { toggle = false, scroll = true } = {}) {
  if (!byId.has(id)) id = "";
  ancestors(id).forEach(a => expanded.add(a));
  if (toggle && byId.get(id).children.length) expanded.has(id) && id === selected ? expanded.delete(id) : expanded.add(id);
  selected = id;
  if (location.hash.slice(1) !== toHash(id)) history.replaceState(null, "", id ? "#" + toHash(id) : location.pathname + location.search);
  renderTree(); renderDetail();
  if (scroll) reveal(id);
}

function reveal(id) {
  const c = $("#canvas"), { pts } = layout(), p = pts.get(id); if (!p) return;
  const left = p.x - 40, right = p.x + 30 + byId.get(id).title.length * 7.2;
  if (left < c.scrollLeft || right > c.scrollLeft + c.clientWidth) c.scrollLeft = Math.max(0, right - c.clientWidth > left ? left : right - c.clientWidth);
  if (p.y - 40 < c.scrollTop || p.y + 40 > c.scrollTop + c.clientHeight) c.scrollTop = Math.max(0, p.y - c.clientHeight / 2);
}

$("#canvas").addEventListener("click", e => { const g = e.target.closest(".node"); if (g) { select(g.dataset.id, { toggle: true, scroll: false }); document.querySelector(`.node[data-id="${CSS.escape(g.dataset.id)}"]`)?.focus({ preventScroll: true }); } });
$("#canvas").addEventListener("keydown", e => {
  const g = e.target.closest(".node"); if (!g) return; const id = g.dataset.id, n = byId.get(id);
  const focus = x => { select(x); document.querySelector(`.node[data-id="${CSS.escape(x)}"]`)?.focus(); };
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(id, { toggle: true }); focus(id); }
  else if (e.key === "ArrowRight" && n.children.length) { e.preventDefault(); if (!expanded.has(id)) { expanded.add(id); focus(id); } else focus(n.children[0]); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); if (expanded.has(id) && n.children.length && id) { expanded.delete(id); focus(id); } else if (n.parent !== null) focus(n.parent); }
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const sibs = n.parent === null ? [id] : byId.get(n.parent).children; const i = sibs.indexOf(id) + (e.key === "ArrowDown" ? 1 : -1); if (sibs[i]) focus(sibs[i]); }
});
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) { select(b.dataset.go); $("#results").hidden = true; } });
$("#expand").onclick = () => { DATA.nodes.forEach(n => n.children.length && expanded.add(n.id)); select(selected); };
$("#collapse").onclick = () => { expanded = new Set([""]); select(""); };
$("#q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(), r = $("#results");
  if (!q) { r.hidden = true; return; }
  const hits = DATA.nodes.filter(n => n.type !== "expert-group" && [n.title, n.summary, ...Object.values(n.fields)].join(" ").toLowerCase().includes(q)).slice(0, 12);
  r.innerHTML = hits.length ? hits.map(n => nodeButton(n.id, n.type === "person" ? "in " + byId.get(byId.get(n.parent).parent).title : TYPES[n.type])).join("") : `<li style="padding:6px 8px;color:var(--muted)">No matches</li>`;
  r.hidden = false;
});
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { const b = $("#results [data-go]"); if (b) { select(b.dataset.go); $("#results").hidden = true; } } if (e.key === "Escape") $("#results").hidden = true; });
$("#legend").innerHTML = Object.entries(TYPES).filter(([t]) => t !== "root" && t !== "expert-group").map(([t, l]) => `<span><span class="dot" style="background:${color(t)}"></span>${l}</span>`).join("");
window.addEventListener("hashchange", () => select(fromHash(location.hash)));
select(fromHash(location.hash) || "therapeutic-areas/immunology/dermatology/psoriasis/plaque-psoriasis");
</script>
